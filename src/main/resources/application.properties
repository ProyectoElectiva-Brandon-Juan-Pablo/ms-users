# ============================================
# TECHSTORE - MICROSERVICIO USUARIOS
# Configuración de Producción
# ============================================

# Configuración del servidor
server.port=8081
spring.application.name=user-service

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/techstore_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Optimizaciones de Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# CONFIGURACIÓN JWT
# ============================================
jwt.secret=TechStore2025_SuperSecretKey_MicroserviciosUniversidad_EAM_JuanPablo_Brandon
jwt.expiration=86400000

# 86400000 ms = 24 horas
# Para desarrollo: 3600000 ms = 1 hora

# ============================================
# CONFIGURACIÓN SECURITY
# ============================================
# Habilitar Spring Security
spring.autoconfigure.exclude=

# ============================================
# SWAGGER/OPENAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.tiendapc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# ACTUATOR (Health check)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================
# CORS (Para desarrollo)
# ============================================
# Configurado en SecurityConfig.java

# ============================================
# OTRAS CONFIGURACIONES
# ============================================
spring.output.ansi.enabled=ALWAYS
spring.jackson.time-zone=America/Bogota
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ============================================
# NOTAS IMPORTANTES
# ============================================
# 1. Cambiar spring.datasource.password por tu password de MySQL
# 2. En producción, cambiar jwt.secret por una clave más segura
# 3. En producción, usar spring.jpa.hibernate.ddl-auto=validate
# 4. Configurar CORS según tu dominio de producción

spring.docker.compose.enabled=false
